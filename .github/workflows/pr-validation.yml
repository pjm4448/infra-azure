# ---------------------------------------------------------------------------
# Workflow: PR Validation
# Runs on every pull request targeting main that modifies infrastructure files.
# Three jobs: Lint & Build → Security Analysis → Validate & What-If
# ---------------------------------------------------------------------------

name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "main.bicep"
      - "modules/**"
      - "parameters/**"
      - "bicepconfig.json"
      - "ps-rule.yaml"
      - ".github/workflows/pr-validation.yml"

# Cancel in-progress runs when a new commit is pushed to the same PR.
# This saves runner minutes and ensures only the latest commit is validated.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Workflow-level permissions apply to all jobs.
# id-token:      OIDC authentication to Azure (validate-and-whatif job)
# contents:      Repository checkout (all jobs)
# pull-requests: Post What-If comment on the PR (validate-and-whatif job)
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  # =========================================================================
  # Job 1: Lint & Build
  # Compiles all Bicep templates and enforces bicepconfig.json linting rules.
  # No Azure authentication required.
  # =========================================================================
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compile and lint Bicep templates
        run: az bicep build --file main.bicep

  # =========================================================================
  # Job 2: Security Analysis (PSRule)
  # Evaluates expanded ARM templates against Well-Architected Framework rules.
  # Runs in parallel with lint-and-build. Advisory — does not block merge.
  # No Azure authentication required.
  # =========================================================================
  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run PSRule for Azure
        uses: microsoft/ps-rule@v2
        with:
          modules: PSRule.Rules.Azure
        continue-on-error: true

  # =========================================================================
  # Job 3: Validate & What-If
  # Authenticates to Azure via OIDC, validates all environments, runs
  # What-If against dev, and posts the result as a sticky PR comment.
  # Depends on lint-and-build — no point validating if templates don't compile.
  # =========================================================================
  validate-and-whatif:
    name: Validate & What-If
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate — Development
        run: |
          az deployment sub validate \
            --location australiaeast \
            --template-file main.bicep \
            --parameters parameters/main.dev.bicepparam

      - name: Validate — Testing
        run: |
          az deployment sub validate \
            --location australiaeast \
            --template-file main.bicep \
            --parameters parameters/main.test.bicepparam

      - name: Validate — Production
        run: |
          az deployment sub validate \
            --location australiaeast \
            --template-file main.bicep \
            --parameters parameters/main.prod.bicepparam

      - name: What-If — Development
        run: |
          az deployment sub what-if \
            --location australiaeast \
            --template-file main.bicep \
            --parameters parameters/main.dev.bicepparam \
            2>&1 | tee whatif-output.txt

      - name: Post What-If results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            let output = '';
            try {
              output = fs.readFileSync('whatif-output.txt', 'utf8').trim();
            } catch {
              output = '⚠️ What-If output file not found. Check the workflow log.';
            }

            // Truncate if output exceeds GitHub comment size limit
            const maxLength = 60000;
            if (output.length > maxLength) {
              output = output.substring(0, maxLength) + '\n\n... (truncated)';
            }

            const marker = '<!-- bicep-whatif -->';

            const body = [
              marker,
              '## 🔍 What-If Results — Development',
              '',
              '<details>',
              '<summary>Click to expand resource changes</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              `📋 Commit: \`${context.sha.substring(0, 7)}\` · [Workflow Run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated existing What-If comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new What-If comment');
            }
