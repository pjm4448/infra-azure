# ---------------------------------------------------------------------------
# Workflow: Reusable Infrastructure Deployment
# Called by deploy-infra.yml for each environment stage.
# Handles OIDC authentication, Bicep deployment, RBAC stabilisation,
# and post-deployment smoke tests.
# ---------------------------------------------------------------------------

name: Reusable Infrastructure Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'GitHub Environment name (development, testing, production)'
      parameterFile:
        required: true
        type: string
        description: 'Path to the .bicepparam parameter file'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy — ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: infra-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az deployment sub create \
            --location australiaeast \
            --template-file main.bicep \
            --parameters ${{ inputs.parameterFile }} \
            --name "infra-${{ inputs.environment }}-${{ github.run_id }}"

      - name: Verify RBAC propagation
        run: |
          case "${{ inputs.environment }}" in
            development) ENV_SHORT="dev" ;;
            testing)     ENV_SHORT="test" ;;
            production)  ENV_SHORT="prod" ;;
          esac

          FUNC_NAME="func-pjmcore-${ENV_SHORT}-aue-01"
          RG_NAME="rg-pjmcore-${ENV_SHORT}-aue-01"
          STORAGE_NAME="stpjmcore${ENV_SHORT}aue01"

          PRINCIPAL_ID=$(az functionapp identity show \
            --name "$FUNC_NAME" \
            --resource-group "$RG_NAME" \
            --query principalId -o tsv)

          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" \
            --query id -o tsv)

          echo "Verifying role assignments for $FUNC_NAME on $STORAGE_NAME..."

          MAX_RETRIES=6
          RETRY_INTERVAL=15

          for i in $(seq 1 $MAX_RETRIES); do
            ROLE_COUNT=$(az role assignment list \
              --assignee "$PRINCIPAL_ID" \
              --scope "$STORAGE_ID" \
              --query "length([])" -o tsv)

            if [ "$ROLE_COUNT" -ge 3 ]; then
              echo "✓ All $ROLE_COUNT role assignments verified (attempt $i/$MAX_RETRIES)"
              exit 0
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Role assignment verification timed out — found $ROLE_COUNT of 3 expected roles"
              exit 1
            fi

            echo "  Attempt $i/$MAX_RETRIES: found $ROLE_COUNT roles, retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

      - name: Post-deployment smoke tests
        run: |
          case "${{ inputs.environment }}" in
            development) ENV_SHORT="dev" ;;
            testing)     ENV_SHORT="test" ;;
            production)  ENV_SHORT="prod" ;;
          esac

          FUNC_NAME="func-pjmcore-${ENV_SHORT}-aue-01"
          RG_NAME="rg-pjmcore-${ENV_SHORT}-aue-01"
          STORAGE_NAME="stpjmcore${ENV_SHORT}aue01"

          echo "=============================="
          echo "Smoke Tests: ${{ inputs.environment }}"
          echo "=============================="

          FAILURES=0

          # --- Check 1: Function App state ---
          # NOTE: "state" is nested under "properties" in the `az functionapp show`
          # JSON response (confirmed via `az functionapp show -o json`), not a
          # top-level field, so `--query "state"` always returns empty regardless
          # of how long we wait. The correct JMESPath is "properties.state".
          # A short retry is kept as a safety net for the brief window right after
          # ARM deployment completes, before the platform finishes provisioning.
          STATE_MAX_RETRIES=5
          STATE_RETRY_INTERVAL=10
          STATE=""

          for i in $(seq 1 $STATE_MAX_RETRIES); do
            STATE=$(az functionapp show \
              --name "$FUNC_NAME" \
              --resource-group "$RG_NAME" \
              --query "properties.state" -o tsv)

            if [ "$STATE" = "Running" ]; then
              break
            fi

            if [ "$i" -lt "$STATE_MAX_RETRIES" ]; then
              echo "  Attempt $i/$STATE_MAX_RETRIES: Function App state '$STATE', retrying in ${STATE_RETRY_INTERVAL}s..."
              sleep $STATE_RETRY_INTERVAL
            fi
          done

          if [ "$STATE" = "Running" ]; then
            echo "✓ Function App state: Running"
          else
            echo "::error::Function App state: '$STATE' (expected 'Running')"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Check 2: System-Assigned Managed Identity ---
          PRINCIPAL_ID=$(az functionapp identity show \
            --name "$FUNC_NAME" \
            --resource-group "$RG_NAME" \
            --query "principalId" -o tsv)

          if [ -n "$PRINCIPAL_ID" ] && [ "$PRINCIPAL_ID" != "None" ]; then
            echo "✓ Managed Identity principal: $PRINCIPAL_ID"
          else
            echo "::error::System-Assigned Managed Identity not found"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Check 3: Storage shared key access disabled ---
          SHARED_KEY=$(az storage account show \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" \
            --query "allowSharedKeyAccess" -o tsv)

          if [ "$SHARED_KEY" = "false" ]; then
            echo "✓ Shared key access: disabled"
          else
            echo "::error::Shared key access: '$SHARED_KEY' (expected 'false')"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Check 4: Deployment package container exists ---
          STORAGE_ID=$(az storage account show \
            --name "$STORAGE_NAME" \
            --resource-group "$RG_NAME" \
            --query "id" -o tsv)

          CONTAINER=$(az resource show \
            --ids "${STORAGE_ID}/blobServices/default/containers/deploymentpackage" \
            --query "name" -o tsv 2>/dev/null || echo "")

          if [ "$CONTAINER" = "deploymentpackage" ]; then
            echo "✓ Deployment container: present"
          else
            echo "::error::Deployment container 'deploymentpackage' not found"
            FAILURES=$((FAILURES + 1))
          fi

          # --- Summary ---
          echo ""
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES smoke test(s) failed for ${{ inputs.environment }}"
            exit 1
          else
            echo "✓ All smoke tests passed for ${{ inputs.environment }}"
          fi
